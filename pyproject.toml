[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor"
version = "0.1.0"
description = "Local desktop audio transcription with speaker diarization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
  "faster-whisper>=1.1,<2",
  "sherpa-onnx>=1.10,<2",
  "av>=12,<17",
  "numpy>=1.26,<3",
  "python-docx>=1.1,<2",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
transcriptor = "transcriptor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

